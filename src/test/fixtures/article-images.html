<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Images and Links</title>
</head>
<body>
  <article>
    <h1>Images and Links</h1>
    <p>Here is an image with an absolute URL.</p>
    <img src="https://example.com/images/absolute.png" alt="Absolute image">
    <p>Here is an image with a relative URL.</p>
    <img src="/images/relative.png" alt="Relative image">
    <p>Here is an image with srcset.</p>
    <img src="https://example.com/images/low.png" srcset="https://example.com/images/high.png 2x" alt="Srcset image">
    <p>Here is a lazy-loaded image.</p>
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="https://example.com/images/lazy.png" alt="Lazy image">
    <p>Here is a link with a relative URL.</p>
    <a href="/articles/related">Related article</a>
    <pre><code>const x = 1;
console.log(x);</code></pre>
  </article>
</body>
</html>
